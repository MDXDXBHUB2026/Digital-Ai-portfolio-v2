<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Sidebar Nav -->
  <rect x="0" y="0" width="220" height="900" fill="#070b14" stroke="#1e293b" stroke-width="1"/>
  <circle cx="38" cy="42" r="16" fill="#0284c7" />
  <path d="M 38 32 L 38 52 M 30 42 L 46 42 M 33 50 Q 38 55 43 50" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="64" y="38" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="13" letter-spacing="1">MARITIME AI</text>
  <text x="64" y="50" fill="#64748b" font-family="sans-serif" font-size="8" letter-spacing="0.5">OPERATIONS CONTROL TOWER</text>

  <g font-family="sans-serif" font-size="11" font-weight="500">
    <text x="42" y="183" fill="#94a3b8">Executive Dashboard</text>
    <text x="42" y="233" fill="#94a3b8">Fleet Overview</text>
    <text x="42" y="283" fill="#94a3b8">Anomaly Detection</text>
    <text x="42" y="333" fill="#94a3b8">Predictive Maintenance</text>
    
    <!-- Active Item: Voyage & Fuel Optimisation -->
    <rect x="10" y="360" width="200" height="36" rx="8" fill="#0f2b48" stroke="#0284c7" stroke-width="1.5"/>
    <text x="42" y="383" fill="#38bdf8" font-weight="700">Voyage &amp; Fuel Optimisation</text>

    <text x="42" y="433" fill="#94a3b8">Safety Monitoring</text>
    <text x="42" y="483" fill="#94a3b8">Staging Admin</text>
  </g>

  <!-- Header -->
  <text x="250" y="42" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">🧭 VOYAGE, WEATHER &amp; FUEL EFFICIENCY CALCULATOR</text>
  <text x="250" y="75" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Voyage &amp; Fuel Optimisation</text>
  <text x="250" y="98" fill="#64748b" font-family="sans-serif" font-size="12">Simulate ocean currents, monsoon wave swells, engine trim angles, and fuel burn optimization.</text>

  <rect x="1310" y="52" width="240" height="38" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="1330" y="76" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">⛽ Average Fleet Fuel Savings: 5.9%</text>

  <!-- LEFT PANEL: SIMULATE ROUTE PARAMETERS -->
  <g transform="translate(250, 140)">
    <rect width="480" height="690" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="35" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">🧭 SIMULATE ROUTE PARAMETERS</text>

    <text x="24" y="80" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Select Vessel</text>
    <rect x="24" y="95" width="432" height="42" rx="8" fill="#070b14" stroke="#334155"/>
    <text x="40" y="121" fill="#ffffff" font-family="sans-serif" font-size="13">MV Pacific Pioneer (Container)</text>
    <text x="430" y="121" fill="#64748b" font-family="sans-serif" font-size="12">▼</text>

    <text x="24" y="170" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Origin Port</text>
    <rect x="24" y="185" width="200" height="42" rx="8" fill="#070b14" stroke="#334155"/>
    <text x="40" y="211" fill="#ffffff" font-family="sans-serif" font-size="13">Dubai Anchorage</text>

    <text x="256" y="170" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Destination Port</text>
    <rect x="256" y="185" width="200" height="42" rx="8" fill="#070b14" stroke="#334155"/>
    <text x="272" y="211" fill="#ffffff" font-family="sans-serif" font-size="13">Jebel Ali</text>

    <text x="24" y="270" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Cruise Target Speed (18.5 kts)</text>
    <line x1="24" y1="300" x2="456" y2="300" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="24" y1="300" x2="280" y2="300" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <circle cx="280" cy="300" r="10" fill="#38bdf8"/>

    <rect x="24" y="340" width="18" height="18" rx="4" fill="#0284c7"/>
    <text x="27" y="353" fill="#ffffff" font-family="sans-serif" font-size="12">✓</text>
    <text x="52" y="354" fill="#94a3b8" font-family="sans-serif" font-size="12">Auto-avoid high wave swell corridors (&gt; 4.0m)</text>

    <rect x="24" y="390" width="432" height="48" rx="10" fill="url(#cyanGrad)"/>
    <text x="140" y="420" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">▷ Calculate AI Optimal Route</text>
  </g>

  <!-- RIGHT PANEL: OPTIMIZED VOYAGE LOGS -->
  <g transform="translate(760, 140)">
    <rect width="790" height="690" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="35" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">OPTIMIZED VOYAGE LOGS</text>

    <!-- LOG ENTRY 1 -->
    <rect x="24" y="65" width="740" height="260" rx="12" fill="#070b14" stroke="#1e293b"/>
    <text x="44" y="95" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">MV Pacific Pioneer</text>
    <rect x="630" y="80" width="115" height="24" rx="6" fill="#064e3b"/>
    <text x="645" y="96" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800">-14.5% Fuel</text>

    <text x="44" y="125" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">Dubai Anchorage ➔ Jebel Ali</text>

    <text x="80" y="165" fill="#64748b" font-family="sans-serif" font-size="10">DISTANCE</text>
    <text x="80" y="185" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">5094 NM</text>

    <text x="330" y="165" fill="#64748b" font-family="sans-serif" font-size="10">FUEL SAVED</text>
    <text x="330" y="185" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="800">59 Tons</text>

    <text x="580" y="165" fill="#64748b" font-family="sans-serif" font-size="10">CO2 PREVENTED</text>
    <text x="580" y="185" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="800">184 MT</text>

    <rect x="44" y="210" width="700" height="90" rx="8" fill="#0c1d33" stroke="#0284c7" stroke-width="1"/>
    <text x="60" y="235" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800">🪄 AI Route Recommendation:</text>
    <text x="60" y="260" fill="#e0f2fe" font-family="sans-serif" font-size="12">For MV Pacific Pioneer's 5,094 NM transit, alter course southward to maintain a 60-nautical-mile safety buffer clear of active storm system.</text>
    <text x="60" y="282" fill="#e0f2fe" font-family="sans-serif" font-size="12">Implement dynamic eco-speed profile to maximize hydrodynamic efficiency, securing targeted 14.5% fuel savings.</text>

    <!-- LOG ENTRY 2 -->
    <rect x="24" y="355" width="740" height="260" rx="12" fill="#070b14" stroke="#1e293b"/>
    <text x="44" y="385" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">MV Pacific Pioneer</text>
    <rect x="630" y="370" width="115" height="24" rx="6" fill="#064e3b"/>
    <text x="645" y="386" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800">-14.8% Fuel</text>

    <text x="44" y="415" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">Rotterdam (NLRTM) ➔ Singapore (SGSIN)</text>

    <text x="80" y="455" fill="#64748b" font-family="sans-serif" font-size="10">DISTANCE</text>
    <text x="80" y="475" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">6104 NM</text>

    <text x="330" y="455" fill="#64748b" font-family="sans-serif" font-size="10">FUEL SAVED</text>
    <text x="330" y="475" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="800">73 Tons</text>

    <text x="580" y="455" fill="#64748b" font-family="sans-serif" font-size="10">CO2 PREVENTED</text>
    <text x="580" y="475" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="800">227 MT</text>

    <rect x="44" y="500" width="700" height="90" rx="8" fill="#0c1d33" stroke="#0284c7" stroke-width="1"/>
    <text x="60" y="525" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800">🪄 AI Optimization Complete:</text>
    <text x="60" y="550" fill="#e0f2fe" font-family="sans-serif" font-size="12">Recommended speed reduction of 0.8 knots during high swell periods reduces fuel burn by 14.8% while preserving schedule window.</text>
  </g>

</svg>
