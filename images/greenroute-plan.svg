<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1760" width="100%" height="100%" style="background-color: #ebf5f0;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2fbf6" />
      <stop offset="100%" stop-color="#e2f3e9" />
    </linearGradient>

    <linearGradient id="mapBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18271c"/>
      <stop offset="50%" stop-color="#243828"/>
      <stop offset="100%" stop-color="#142117"/>
    </linearGradient>

    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a2e18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .txt-title { font-family: system-ui, -apple-system, Roboto, sans-serif; font-weight: 800; fill: #064e3b; }
    .txt-sub { font-family: system-ui, -apple-system, Roboto, sans-serif; font-weight: 500; fill: #475569; }
    .txt-dark { font-family: system-ui, -apple-system, Roboto, sans-serif; font-weight: 700; fill: #0f172a; }
    .txt-muted { font-family: system-ui, -apple-system, Roboto, sans-serif; font-weight: 600; fill: #64748b; }
    .txt-green { font-family: system-ui, -apple-system, Roboto, sans-serif; font-weight: 800; fill: #059669; }
    .txt-white { font-family: system-ui, -apple-system, Roboto, sans-serif; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Background -->
  <rect width="800" height="1760" fill="url(#bgGrad)" />

  <!-- App Header Bar -->
  <rect x="0" y="0" width="800" height="96" fill="#ffffff" />
  <circle cx="56" cy="48" r="24" fill="#059669" />
  <path d="M 46 54 C 44 40, 58 34, 68 38 C 68 52, 54 60, 46 54 Z" fill="#ffffff" />
  <path d="M 48 52 Q 58 46 64 42" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <text x="96" y="42" class="txt-title" font-size="24">GreenRoute AI</text>
  <rect x="280" y="24" width="68" height="24" rx="6" fill="#dcfce7" />
  <text x="291" y="40" fill="#166534" font-family="sans-serif" font-weight="800" font-size="12">DEMO</text>
  <text x="96" y="68" class="txt-sub" font-size="14">Carbon-Aware &amp; Inclusive Mobility Decision System</text>

  <!-- Header Right Actions -->
  <rect x="570" y="28" width="120" height="40" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="596" y="53" class="txt-dark" font-size="15">🌐 العربية</text>
  <circle cx="730" cy="48" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="723" y="54" class="txt-dark" font-size="17">T</text>
  <rect x="742" y="28" width="18" height="18" rx="9" fill="#059669"/>
  <text x="744" y="41" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">1x</text>

  <!-- SATELLITE MAP CONTAINER -->
  <g transform="translate(24, 112)">
    <rect width="752" height="420" rx="28" fill="url(#mapBgGrad)" filter="url(#shadow)"/>

    <!-- Coastline & Water -->
    <path d="M 0 0 L 752 0 L 752 130 Q 500 190 280 150 Q 100 110 0 200 Z" fill="#0f2b48" opacity="0.95"/>
    <path d="M 0 0 L 752 0 L 752 110 Q 480 170 260 130 Q 80 90 0 170 Z" fill="#143a62" opacity="0.8"/>

    <!-- Palm Jumeirah Artwork -->
    <path d="M 220 80 Q 240 40 260 80 M 210 90 Q 240 50 270 90 M 200 100 Q 240 60 280 100 M 235 120 L 245 120 L 240 70 Z" stroke="#a38f6d" stroke-width="3" fill="none" opacity="0.85"/>

    <!-- Sheikh Zayed Road & Metro Line -->
    <path d="M 0 300 Q 350 240 752 280" stroke="#0ea5e9" stroke-width="5" fill="none" opacity="0.9"/>
    <path d="M 80 420 Q 380 280 752 220" stroke="#10b981" stroke-width="6" fill="none"/>
    <path d="M 80 420 Q 380 280 752 220" stroke="#ffffff" stroke-width="2" stroke-dasharray="8,6" fill="none"/>

    <!-- Map Control Overlay Elements -->
    <!-- Top Left: Progress Card -->
    <rect x="20" y="20" width="180" height="56" rx="16" fill="#ffffff" opacity="0.96"/>
    <text x="34" y="42" class="txt-dark" font-size="13">Journey Progress:</text>
    <text x="34" y="64" class="txt-green" font-size="20">0%</text>

    <!-- Top Middle Controls -->
    <rect x="212" y="20" width="84" height="38" rx="19" fill="#047857"/>
    <text x="228" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">EN  عربي</text>

    <circle cx="320" cy="39" r="19" fill="#ffffff" opacity="0.95"/>
    <text x="312" y="45" font-size="15">🧭</text>

    <rect x="350" y="20" width="124" height="38" rx="19" fill="#047857"/>
    <text x="364" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">🚘 Traffic ON</text>

    <circle cx="498" cy="39" r="19" fill="#0284c7"/>
    <text x="490" y="45" fill="#ffffff" font-size="15">🌐</text>

    <!-- Top Right: Delay Pill -->
    <rect x="620" y="20" width="76" height="34" rx="17" fill="#0f172a" opacity="0.95"/>
    <text x="632" y="42" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800">+15m</text>
    <circle cx="688" cy="20" r="12" fill="#ef4444"/>

    <!-- Stage 1 Walk Banner -->
    <rect x="212" y="68" width="310" height="36" rx="18" fill="#064e3b"/>
    <text x="228" y="91" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800">🚶 Walk to Dubai Internet City Station</text>

    <!-- Incidents Bar (Neat & Clean Spacing) -->
    <rect x="20" y="118" width="712" height="40" rx="20" fill="#ffffff" opacity="0.96"/>
    <text x="36" y="143" class="txt-dark" font-size="12" font-weight="900">🚘 DUBAI INCIDENTS:</text>

    <rect x="180" y="124" width="66" height="28" rx="14" fill="#0f172a"/>
    <text x="193" y="143" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">All (6)</text>

    <rect x="256" y="124" width="95" height="28" rx="14" fill="#f1f5f9"/>
    <text x="268" y="143" class="txt-dark" font-size="12">Closures 🔴</text>

    <rect x="360" y="124" width="105" height="28" rx="14" fill="#f1f5f9"/>
    <text x="372" y="143" class="txt-dark" font-size="12">Accidents ⚠</text>

    <rect x="474" y="124" width="115" height="28" rx="14" fill="#f1f5f9"/>
    <text x="486" y="143" class="txt-dark" font-size="12">Congestion 🟠</text>

    <!-- Map Traffic Pin Badges (Placed on roads below incident bar) -->
    <rect x="540" y="180" width="56" height="26" rx="13" fill="#ef4444"/>
    <text x="550" y="197" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">+8m</text>

    <rect x="610" y="220" width="60" height="26" rx="13" fill="#f59e0b"/>
    <text x="620" y="237" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">+10m</text>

    <rect x="480" y="250" width="60" height="26" rx="13" fill="#f59e0b"/>
    <text x="490" y="267" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">+14m</text>

    <!-- Route Start Pin -->
    <rect x="80" y="230" width="120" height="32" rx="16" fill="#0f172a"/>
    <text x="94" y="251" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">🏃 Start • 0%</text>

    <circle cx="110" cy="285" r="18" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <text x="103" y="290" fill="#ffffff" font-size="14">🚀</text>

    <rect x="580" y="280" width="110" height="32" rx="16" fill="#059669"/>
    <text x="594" y="301" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">🏁 Dubai Mall</text>

    <!-- Bottom Map Controls (Separate Left & Right positions) -->
    <rect x="20" y="360" width="160" height="42" rx="12" fill="#ffffff"/>
    <text x="36" y="386" class="txt-dark" font-size="13" font-weight="800">🗺 Default View</text>

    <rect x="535" y="366" width="115" height="32" rx="8" fill="#ffffff" opacity="0.92"/>
    <text x="547" y="387" class="txt-dark" font-size="11">Tiles © Esri</text>

    <rect x="665" y="322" width="46" height="76" rx="12" fill="#ffffff"/>
    <text x="681" y="352" class="txt-dark" font-size="20">+</text>
    <line x1="675" y1="362" x2="701" y2="362" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="682" y="388" class="txt-dark" font-size="20">-</text>
  </g>

  <!-- STAGE 1 OF 4 CAROUSEL CARD -->
  <g transform="translate(24, 552)">
    <rect width="752" height="210" rx="24" fill="#ffffff" filter="url(#shadow)"/>

    <text x="28" y="42" class="txt-dark" font-size="16" font-weight="900">🚀 STAGE 1 OF 4</text>
    <rect x="170" y="22" width="70" height="26" rx="13" fill="#dcfce7"/>
    <text x="184" y="40" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="800">🚶 Walk</text>

    <circle cx="620" cy="34" r="18" fill="#f1f5f9"/>
    <text x="613" y="40" class="txt-dark" font-size="14">▶</text>

    <circle cx="660" cy="34" r="18" fill="#f1f5f9"/>
    <text x="653" y="40" class="txt-dark" font-size="14">❮</text>

    <circle cx="700" cy="34" r="18" fill="#f1f5f9"/>
    <text x="693" y="40" class="txt-dark" font-size="14">❯</text>

    <!-- Stage 1 Active Box -->
    <rect x="28" y="58" width="450" height="114" rx="20" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
    <circle cx="68" cy="106" r="22" fill="#059669"/>
    <text x="58" y="113" fill="#ffffff" font-size="18">👣</text>

    <text x="104" y="86" class="txt-green" font-size="13" font-weight="900">WALK</text>
    <text x="104" y="108" class="txt-dark" font-size="15" font-weight="800">Walk to Dubai station</text>
    <rect x="330" y="72" width="120" height="24" rx="12" fill="#059669"/>
    <text x="342" y="88" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">Current stage</text>

    <text x="104" y="130" class="txt-muted" font-size="13">⏱ 6 min • 420 m</text>

    <rect x="104" y="142" width="340" height="22" rx="6" fill="#e0f2fe"/>
    <text x="112" y="157" fill="#0369a1" font-family="sans-serif" font-size="11" font-weight="700">♿ Step-free pavement with tactile guidance</text>

    <!-- Stage 2 Preview Box -->
    <rect x="490" y="58" width="234" height="114" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="526" cy="106" r="22" fill="#0284c7"/>
    <text x="516" y="113" fill="#ffffff" font-size="18">🚇</text>

    <text x="560" y="86" fill="#0284c7" font-family="sans-serif" font-size="13" font-weight="900">METRO</text>
    <text x="560" y="108" class="txt-dark" font-size="14" font-weight="800">Dubai Metro Red Line</text>
    <text x="560" y="132" class="txt-muted" font-size="13">⏱ 27 min</text>

    <!-- Indicators -->
    <circle cx="360" cy="190" r="6" fill="#059669"/>
    <circle cx="380" cy="190" r="5" fill="#cbd5e1"/>
    <circle cx="396" cy="190" r="5" fill="#cbd5e1"/>
    <circle cx="412" cy="190" r="5" fill="#cbd5e1"/>
  </g>

  <!-- JOURNEY PROGRESS CARDS ROW -->
  <g transform="translate(24, 782)">
    <rect width="752" height="180" rx="24" fill="#ffffff" filter="url(#shadow)"/>

    <text x="28" y="40" class="txt-dark" font-size="16" font-weight="900">⏱ JOURNEY PROGRESS</text>
    <rect x="640" y="20" width="84" height="28" rx="14" fill="#dcfce7"/>
    <text x="656" y="39" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="800">1 / 4 of</text>

    <!-- Card 1 -->
    <rect x="28" y="58" width="220" height="96" rx="18" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
    <circle cx="60" cy="106" r="20" fill="#059669"/>
    <text x="50" y="112" fill="#ffffff" font-size="16">🚶</text>
    <text x="90" y="86" class="txt-green" font-size="11" font-weight="900">STAGE 1 • WALK</text>
    <text x="90" y="110" class="txt-dark" font-size="16" font-weight="900">6 MIN</text>
    <text x="90" y="132" class="txt-sub" font-size="13">Walk to Station</text>

    <!-- Card 2 -->
    <rect x="260" y="58" width="220" height="96" rx="18" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="292" cy="106" r="20" fill="#0284c7"/>
    <text x="282" y="112" fill="#ffffff" font-size="16">🚇</text>
    <text x="322" y="86" fill="#0284c7" font-family="sans-serif" font-size="11" font-weight="900">STAGE 2 • METRO</text>
    <text x="322" y="110" class="txt-dark" font-size="16" font-weight="900">27 MIN</text>
    <text x="322" y="132" class="txt-sub" font-size="13">Dubai Metro</text>

    <!-- Card 3 -->
    <rect x="492" y="58" width="232" height="96" rx="18" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
    <circle cx="524" cy="106" r="20" fill="#059669"/>
    <text x="514" y="112" fill="#ffffff" font-size="16">🚶</text>
    <text x="554" y="86" class="txt-green" font-size="11" font-weight="900">STAGE 3 • WALK</text>
    <text x="554" y="110" class="txt-dark" font-size="16" font-weight="900">5 MIN</text>
    <text x="554" y="132" class="txt-sub" font-size="13">Walk to Mall</text>
  </g>

  <!-- ESTIMATED JOURNEY SUSTAINABILITY IMPACT -->
  <g transform="translate(24, 982)">
    <rect width="752" height="230" rx="24" fill="#ffffff" filter="url(#shadow)"/>

    <circle cx="52" cy="42" r="20" fill="#dcfce7"/>
    <path d="M 44 48 C 42 34, 56 28, 64 32 C 64 46, 52 54, 44 48 Z" fill="#059669" />

    <text x="84" y="40" class="txt-dark" font-size="15" font-weight="900">ESTIMATED JOURNEY SUSTAINABILITY IMPACT</text>
    <rect x="600" y="20" width="124" height="28" rx="14" fill="#dcfce7"/>
    <text x="616" y="39" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="800">⚡ AI Verified</text>

    <text x="28" y="82" class="txt-sub" font-size="14">This journey reduces approximately <tspan class="txt-green" font-weight="900">2.59 kg CO2e</tspan> compared with driving.</text>

    <!-- 4 Metrics Items Grid -->
    <rect x="28" y="108" width="162" height="100" rx="16" fill="#f0fdf4"/>
    <text x="40" y="134" class="txt-green" font-size="12">🌱 CO2 SAVED</text>
    <text x="40" y="174" class="txt-green" font-size="22">2.59 kg</text>

    <rect x="206" y="108" width="162" height="100" rx="16" fill="#f0fdf4"/>
    <text x="218" y="134" class="txt-green" font-size="12">🌲 TREES EQUIV</text>
    <text x="218" y="174" class="txt-dark" font-size="22">4.7 trees</text>

    <rect x="384" y="108" width="162" height="100" rx="16" fill="#f0fdf4"/>
    <text x="396" y="134" class="txt-green" font-size="12">⛽ FUEL SAVED</text>
    <text x="396" y="174" class="txt-dark" font-size="22">1.3 L</text>

    <rect x="562" y="108" width="162" height="100" rx="16" fill="#f0fdf4"/>
    <text x="574" y="134" class="txt-green" font-size="12">🔥 CALORIES</text>
    <text x="574" y="174" class="txt-dark" font-size="22">46 kcal</text>
  </g>

  <!-- WEATHER & OUTDOOR COMFORT -->
  <g transform="translate(24, 1232)">
    <rect width="752" height="120" rx="24" fill="#fffbebe6" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>

    <circle cx="56" cy="46" r="22" fill="#f59e0b"/>
    <text x="44" y="54" fill="#ffffff" font-size="22">☀️</text>

    <text x="92" y="42" class="txt-dark" font-size="20" font-weight="900">Dubai 33°C</text>
    <text x="92" y="64" class="txt-sub" font-size="13">Sunny &amp; Clear • Feels 36°C</text>

    <rect x="540" y="24" width="180" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="556" y="45" fill="#b45309" font-family="sans-serif" font-size="13" font-weight="800">⚠ Heat Advisory</text>

    <line x1="28" y1="80" x2="724" y2="80" stroke="#fef3c7" stroke-width="1.5"/>
    <text x="28" y="104" class="txt-sub" font-size="13">Outdoor Comfort: <tspan class="txt-green" font-weight="800">AC Pedestrian Bridges Recommended</tspan></text>
    <text x="560" y="104" class="txt-sub" font-size="13">AQI 45 (Good Air)</text>
  </g>

  <!-- ORIGIN / DESTINATION -->
  <g transform="translate(24, 1372)">
    <rect width="752" height="240" rx="24" fill="#ffffff" filter="url(#shadow)"/>

    <circle cx="44" cy="36" r="6" fill="#10b981"/>
    <text x="60" y="40" class="txt-muted" font-size="12" font-weight="900">ORIGIN</text>

    <rect x="28" y="50" width="696" height="60" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="56" cy="80" r="14" fill="#dcfce7"/>
    <text x="49" y="85" fill="#059669" font-size="14">📍</text>
    <text x="84" y="74" class="txt-dark" font-size="16" font-weight="900">Dubai Internet City</text>
    <text x="84" y="94" class="txt-sub" font-size="12">Technology &amp; Innovation Hub • Dubai Internet City (Red Line)</text>
    <text x="690" y="85" class="txt-muted" font-size="18">❯</text>

    <!-- Swap Icon -->
    <circle cx="376" cy="122" r="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="367" y="128" class="txt-dark" font-size="16">⇅</text>

    <circle cx="44" cy="148" r="6" fill="#0f172a"/>
    <text x="60" y="152" class="txt-muted" font-size="12" font-weight="900">DESTINATION</text>

    <rect x="28" y="162" width="696" height="60" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="56" cy="192" r="14" fill="#f1f5f9"/>
    <text x="50" y="196" fill="#0f172a" font-size="12">🏁</text>
    <text x="84" y="186" class="txt-dark" font-size="16" font-weight="900">Dubai Mall</text>
    <text x="84" y="206" class="txt-sub" font-size="12">Downtown Cultural Core • Burj Khalifa / Dubai Mall (Red Line)</text>
    <text x="690" y="197" class="txt-muted" font-size="18">❯</text>
  </g>

  <!-- BOTTOM NAVIGATION BAR -->
  <g transform="translate(0, 1640)">
    <rect width="800" height="120" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Plan Tab (Active) -->
    <rect x="36" y="12" width="148" height="80" rx="20" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="110" y="48" font-size="28" text-anchor="middle">🚀</text>
    <text x="110" y="76" class="txt-green" font-size="15" text-anchor="middle">Plan</text>

    <g transform="translate(240, 0)">
      <text x="60" y="48" font-size="28" text-anchor="middle">🔀</text>
      <text x="60" y="76" class="txt-muted" font-size="15" text-anchor="middle">Compare</text>
    </g>

    <g transform="translate(440, 0)">
      <circle cx="82" cy="24" r="10" fill="#059669"/>
      <text x="82" y="31" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">3</text>
      <text x="60" y="48" font-size="28" text-anchor="middle">📊</text>
      <text x="60" y="76" class="txt-muted" font-size="15" text-anchor="middle">Impact</text>
    </g>

    <g transform="translate(620, 0)">
      <text x="60" y="48" font-size="28" text-anchor="middle">👤</text>
      <text x="60" y="76" class="txt-muted" font-size="15" text-anchor="middle">Profile</text>
    </g>
  </g>

</svg>
