  <text x="1275" y="160" fill="#94a3b8" font-family="sans-serif" font-size="11">Bulk Carrier</text>

  <rect x="1356" y="142" width="70" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="1368" y="160" fill="#94a3b8" font-family="sans-serif" font-size="11">Tugboat</text>

  <rect x="1434" y="142" width="104" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="1446" y="160" fill="#94a3b8" font-family="sans-serif" font-size="11">Offshore Vessel</text>

