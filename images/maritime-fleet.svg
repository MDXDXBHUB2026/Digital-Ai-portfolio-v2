<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Sidebar Nav -->
  <rect x="0" y="0" width="220" height="900" fill="#070b14" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Logo -->
  <circle cx="38" cy="42" r="16" fill="#0284c7" />
  <path d="M 38 32 L 38 52 M 30 42 L 46 42 M 33 50 Q 38 55 43 50" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="64" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" letter-spacing="1">MARITIME AI</text>
  <text x="64" y="50" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" letter-spacing="0.5">OPERATIONS CONTROL TOWER</text>

  <!-- Nav Items -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
    <!-- Active Item: Fleet Overview -->
    <rect x="10" y="210" width="200" height="36" rx="8" fill="#0f2b48" stroke="#0284c7" stroke-width="1.5"/>
    <text x="42" y="233" fill="#38bdf8" font-weight="700">Fleet Overview</text>
    
    <text x="42" y="183" fill="#94a3b8">Executive Dashboard</text>
    <text x="42" y="283" fill="#94a3b8">Anomaly Detection</text>
    <text x="42" y="333" fill="#94a3b8">Predictive Maintenance</text>
    <text x="42" y="383" fill="#94a3b8">Voyage &amp; Fuel Optimisation</text>
    <text x="42" y="433" fill="#94a3b8">Safety Monitoring</text>
    <text x="42" y="483" fill="#94a3b8">Staging Admin</text>
  </g>

  <!-- Header Content -->
  <text x="250" y="42" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">FLEET OVERVIEW &amp; VESSEL DIRECTORY</text>
  <text x="250" y="75" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Active Fleet Matrix</text>
  <text x="250" y="98" fill="#64748b" font-family="sans-serif" font-size="12">Real-time speed telemetry, destination tracking, and engine maintenance scores for all global vessels.</text>

  <!-- Button: Register Vessel -->
  <rect x="1390" y="52" width="160" height="38" rx="8" fill="url(#cyanGlow)"/>
  <text x="1415" y="76" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">+ Register New Vessel</text>

  <!-- Filter Bar -->
  <rect x="250" y="130" width="1300" height="52" rx="12" fill="#0d1527" stroke="#1e293b"/>
  <rect x="265" y="142" width="280" height="28" rx="6" fill="#070b14" stroke="#334155"/>
  <text x="280" y="160" fill="#64748b" font-family="sans-serif" font-size="11">🔍 Filter by vessel name, IMO, location...</text>

  <!-- Filter Tags -->
