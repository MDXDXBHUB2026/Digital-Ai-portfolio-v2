    <text x="40" y="158" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800">19.4 kts</text>

    <text x="170" y="130" fill="#64748b" font-family="sans-serif" font-size="10">FUEL LEVEL</text>
    <text x="170" y="158" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="800">78%</text>

    <text x="290" y="130" fill="#64748b" font-family="sans-serif" font-size="10">ENGINE LOAD</text>
    <text x="290" y="158" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800">82%</text>

    <line x1="16" y1="190" x2="394" y2="190" stroke="#1e293b" stroke-width="1"/>

    <text x="16" y="225" fill="#64748b" font-family="sans-serif" font-size="11">Destination:</text>
    <text x="280" y="225" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Singapore (SGSIN)</text>

    <text x="16" y="260" fill="#64748b" font-family="sans-serif" font-size="11">Predicted ETA:</text>
    <text x="280" y="260" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">14 Aug 2026, 08:30</text>
