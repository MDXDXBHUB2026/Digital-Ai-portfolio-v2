<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Sidebar Nav -->
  <rect x="0" y="0" width="220" height="900" fill="#070b14" stroke="#1e293b" stroke-width="1"/>
  <circle cx="38" cy="42" r="16" fill="#0284c7" />
  <path d="M 38 32 L 38 52 M 30 42 L 46 42 M 33 50 Q 38 55 43 50" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="64" y="38" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="13" letter-spacing="1">MARITIME AI</text>
  <text x="64" y="50" fill="#64748b" font-family="sans-serif" font-size="8" letter-spacing="0.5">OPERATIONS CONTROL TOWER</text>

  <g font-family="sans-serif" font-size="11" font-weight="500">
    <text x="42" y="183" fill="#94a3b8">Executive Dashboard</text>
    <text x="42" y="233" fill="#94a3b8">Fleet Overview</text>
    
    <!-- Active Item: Anomaly Detection -->
    <rect x="10" y="260" width="200" height="36" rx="8" fill="#0f2b48" stroke="#0284c7" stroke-width="1.5"/>
    <text x="42" y="283" fill="#38bdf8" font-weight="700">Anomaly Detection <tspan fill="#ef4444" font-weight="800">(3)</tspan></text>
    
    <text x="42" y="333" fill="#94a3b8">Predictive Maintenance</text>
    <text x="42" y="383" fill="#94a3b8">Voyage &amp; Fuel Optimisation</text>
    <text x="42" y="433" fill="#94a3b8">Safety Monitoring</text>
    <text x="42" y="483" fill="#94a3b8">Staging Admin</text>
  </g>

  <!-- Header -->
  <text x="250" y="42" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">⚠ AUTONOMOUS RISK DETECTION &amp; INCIDENT COMMAND</text>
  <text x="250" y="75" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Anomaly Detection</text>
  <text x="250" y="98" fill="#64748b" font-family="sans-serif" font-size="12">Real-time automated incident detection covering weather storms, machinery telemetry spikes, AIS spoofing alerts, and CII emission compliance breaches.</text>

  <rect x="1380" y="52" width="170" height="38" rx="8" fill="url(#redGlow)"/>
  <text x="1402" y="76" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">+ Report New Anomaly</text>

  <!-- Filter Bar -->
  <rect x="250" y="130" width="1300" height="48" rx="10" fill="#0d1527" stroke="#1e293b"/>
  <text x="270" y="159" fill="#64748b" font-family="sans-serif" font-size="11">Filter Severity:</text>
  <rect x="360" y="140" width="45" height="28" rx="6" fill="#0284c7"/>
  <text x="372" y="158" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">ALL</text>

  <rect x="415" y="140" width="55" height="28" rx="6" fill="#1e293b"/>
  <text x="427" y="158" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="700">Critical</text>

  <rect x="478" y="140" width="45" height="28" rx="6" fill="#1e293b"/>
  <text x="488" y="158" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="700">High</text>

  <rect x="531" y="140" width="58" height="28" rx="6" fill="#1e293b"/>
  <text x="541" y="158" fill="#38bdf8" font-family="sans-serif" font-size="11">Medium</text>

  <rect x="597" y="140" width="45" height="28" rx="6" fill="#1e293b"/>
  <text x="608" y="158" fill="#a855f7" font-family="sans-serif" font-size="11">Low</text>

  <text x="1470" y="159" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">3 Total Alerts</text>

  <!-- ALERT 1: Cylinder Exhaust Gas Temp Spike -->
  <g transform="translate(250, 200)">
    <rect width="1300" height="190" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="20" y="20" width="115" height="22" rx="4" fill="#0284c7"/>
    <text x="30" y="35" fill="#e0f2fe" font-family="sans-serif" font-size="10" font-weight="800">MEDIUM SEVERITY</text>
    
    <text x="150" y="35" fill="#64748b" font-family="sans-serif" font-size="11">Engine Telemetry • <tspan fill="#38bdf8" font-weight="700">Nordic Titan</tspan></text>
    
    <text x="20" y="75" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">Cylinder #4 Exhaust Gas Temp Spike (+42°C)</text>
    <text x="20" y="98" fill="#94a3b8" font-family="sans-serif" font-size="12">Exhaust gas temperature on Cylinder #4 elevated to 448°C during idling at anchor. Fuel injection valve latency anomaly suspected.</text>

    <!-- AI Recommendation box -->
    <rect x="20" y="118" width="1260" height="52" rx="8" fill="#0c1d33" stroke="#0284c7" stroke-width="1"/>
    <text x="38" y="138" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800">🪄 AI Recommended Protocol:</text>
    <text x="38" y="156" fill="#e0f2fe" font-family="sans-serif" font-size="12">Schedule local chief engineer inspection of injector #4 solenoid valve before main engine startup.</text>

    <rect x="1170" y="20" width="110" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="1185" y="40" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">Status: Open ▼</text>
  </g>

  <!-- ALERT 2: Typhoon Advisory -->
  <g transform="translate(250, 410)">
    <rect width="1300" height="190" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="20" y="20" width="100" height="22" rx="4" fill="#b45309"/>
    <text x="30" y="35" fill="#fef3c7" font-family="sans-serif" font-size="10" font-weight="800">HIGH SEVERITY</text>
    
    <text x="135" y="35" fill="#64748b" font-family="sans-serif" font-size="11">Weather • <tspan fill="#38bdf8" font-weight="700">Poseidon Express</tspan></text>
    
    <text x="20" y="75" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">Typhoon Outer Swell Advisory (North Pacific)</text>
    <text x="20" y="98" fill="#94a3b8" font-family="sans-serif" font-size="12">Developing Category 2 storm centered at 34°N 148°E producing 6.5m wave swells along original transit corridor.</text>

    <rect x="20" y="118" width="1260" height="52" rx="8" fill="#1f1807" stroke="#b45309" stroke-width="1"/>
    <text x="38" y="138" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="800">🪄 AI Recommended Protocol:</text>
    <text x="38" y="156" fill="#fef3c7" font-family="sans-serif" font-size="12">Route detour 45 nautical miles south-southeast to maintain swell angle &lt; 30° relative to bow.</text>

    <rect x="1150" y="20" width="130" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="1162" y="40" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">Status: Investigating ▼</text>
  </g>

  <!-- ALERT 3: Minor CO2 Warning -->
  <g transform="translate(250, 620)">
    <rect width="1300" height="190" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="20" y="20" width="95" height="22" rx="4" fill="#6b21a8"/>
    <text x="30" y="35" fill="#f3e8ff" font-family="sans-serif" font-size="10" font-weight="800">LOW SEVERITY</text>
    
    <text x="130" y="35" fill="#64748b" font-family="sans-serif" font-size="11">Emission Breach • <tspan fill="#38bdf8" font-weight="700">MV Pacific Pioneer</tspan></text>
    
    <text x="20" y="75" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">Minor CO2 Intensity Warning (CII Metric)</text>
    <text x="20" y="98" fill="#94a3b8" font-family="sans-serif" font-size="12">Current 24h operational carbon intensity index trending towards Class D threshold due to high speed run (19.4 kts).</text>

    <rect x="20" y="118" width="1260" height="52" rx="8" fill="#1a0c2e" stroke="#a855f7" stroke-width="1"/>
    <text x="38" y="138" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="800">🪄 AI Recommended Protocol:</text>
    <text x="38" y="156" fill="#f3e8ff" font-family="sans-serif" font-size="12">Reduce vessel speed by 0.7 knots to drop daily fuel burn by 4.2 tons and restore Class B CII rating.</text>

    <rect x="1170" y="20" width="110" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="1185" y="40" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">Status: Open ▼</text>
  </g>

</svg>
