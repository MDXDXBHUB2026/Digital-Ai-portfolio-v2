      <text x="30" y="165" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start"><tspan x="30" >Real-time transaction tracking, merchant</tspan><tspan x="30" dy="20">categorization, multi-card expenditure records,</tspan><tspan x="30" dy="20">and searchable ledger history.</tspan></text>

      <line x1="30" y1="240" x2="390" y2="240" stroke="rgba(255,255,255,0.1)"/>

