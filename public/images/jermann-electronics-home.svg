    * { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-serif { font-family: 'Cinzel', Georgia, serif; }
  </style>

    <rect width="1600" height="900" fill="url(#elecBgGrad)" />

