      <text x="30" y="165" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="start"><tspan x="30" >Multi-currency wealth tracking, automated AI</tspan><tspan x="30" dy="20">financial diagnostics, transaction history,</tspan><tspan x="30" dy="20">budget controls, and high-precision liquidity</tspan><tspan x="30" dy="20">monitoring.</tspan></text>

