<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
    
  <defs>
    <!-- Vibrant Green, Yellow & Orange Background Gradient -->
    <linearGradient id="elecBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="35%" stop-color="#fefce8" />
      <stop offset="70%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <!-- Green, Yellow & Orange Brand Gradients -->
    <linearGradient id="greenYellowOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="multicolorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="33%" stop-color="#d97706" />
      <stop offset="66%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="blueOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="orangeYellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="amberGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="yellowBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fefce8" stop-opacity="0.88" />
    </linearGradient>

    <linearGradient id="glassInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.18" />
    </linearGradient>

    <!-- Soft Diffuse Shadows -->
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <filter id="colorfulGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap');
    * { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-serif { font-family: 'Cinzel', Georgia, serif; }
  </style>

    <rect width="1600" height="900" fill="url(#elecBgGrad)" />

    <!-- Ambient Green, Yellow & Orange Glows -->
    <g opacity="0.8">
      <circle cx="200" cy="200" r="380" fill="#34d399" opacity="0.40" filter="url(#colorfulGlow)"/>
      <circle cx="1400" cy="300" r="400" fill="#fb923c" opacity="0.38" filter="url(#colorfulGlow)"/>
      <circle cx="800" cy="700" r="420" fill="#facc15" opacity="0.35" filter="url(#colorfulGlow)"/>
    </g>

    
    <!-- Top Header Bar -->
    <rect x="0" y="0" width="1600" height="64" fill="#ffffff" fill-opacity="0.85" />
    <line x1="0" y1="64" x2="1600" y2="64" stroke="rgba(226, 232, 240, 0.8)" stroke-width="1"/>

    <!-- Brand Logo -->
    <g transform="translate(40, 15)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#cyanBlueGrad)" />
      <text x="12" y="24" class="font-serif" font-size="20" font-weight="900" fill="#ffffff">J</text>
      <text x="44" y="18" class="font-serif" font-size="15" font-weight="900" fill="#0f172a" letter-spacing="1">JERMANN</text>
      <text x="44" y="29" font-size="8" font-weight="800" fill="#0284c7" letter-spacing="1.2">ELECTRONICS • DIGITAL COMMERCE</text>
    </g>

    
        <text x="390" y="36" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.5">STORE</text>
      
        <rect x="454" y="18" width="80" height="28" rx="8" fill="url(#cyanBlueGrad)" fill-opacity="0.12" stroke="#0284c7" stroke-opacity="0.4" />
        <text x="462" y="36" fill="#0284c7" font-size="11" font-weight="800" letter-spacing="0.5">CATALOG</text>
      
        <text x="550" y="36" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.5">FLAGSHIP X1</text>
      
        <text x="670" y="36" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.5">AUDIO &amp; SOUND</text>
      
        <text x="838" y="36" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.5">SMART HOME</text>
      
        <text x="950" y="36" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.5">CART (3)</text>
      
        <text x="1046" y="36" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.5">SUPPORT</text>
      

    <!-- Search & Cart Action Buttons -->
    <g transform="translate(1420, 15)">
      <rect x="0" y="0" width="140" height="34" rx="8" fill="url(#cyanBlueGrad)" />
      <text x="22" y="21" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">SHOP NOW →</text>
    </g>
  

    <g transform="translate(80, 85)">
      <text x="0" y="24" font-size="24" font-weight="900" fill="#0f172a">MODULAR ELECTRONICS CATALOG</text>
      <text x="0" y="48" font-size="13" font-weight="500" fill="#64748b">Filter by product category, specs, hardware architecture, and executive availability.</text>

      <!-- Search Bar -->
