        <text x="16" y="66" font-size="10" font-weight="600" fill="#94a3b8">Spent: AED 320.00</text>
        <text x="362" y="66" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">Limit: AED 1,200.00</text>
      </g>
    
      <g transform="translate(0, 184)">
