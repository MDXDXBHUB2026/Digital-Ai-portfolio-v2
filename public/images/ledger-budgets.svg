        <!-- Progress Bar -->
        <rect x="16" y="40" width="346" height="8" rx="4" fill="#1e293b"/>
        <rect x="16" y="40" width="10" height="8" rx="4" fill="url(#goldGrad)"/>

        <text x="16" y="66" font-size="10" font-weight="600" fill="#94a3b8">Spent: AED 0.00</text>
        <text x="362" y="66" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">Limit: AED 1,500.00</text>
      </g>
    
      <g transform="translate(0, 276)">
        <rect width="378" height="84" rx="14" fill="url(#phoneCardGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="16" y="28" font-size="14">⛽</text>
        <text x="40" y="27" font-size="12" font-weight="800" fill="#ffffff">Transport &amp; Fuel</text>
        <text x="362" y="27" font-size="11" font-weight="800" fill="#ffd700" text-anchor="end">22%</text>

        <!-- Progress Bar -->
        <rect x="16" y="40" width="346" height="8" rx="4" fill="#1e293b"/>
        <rect x="16" y="40" width="76" height="8" rx="4" fill="url(#goldGrad)"/>

        <text x="16" y="66" font-size="10" font-weight="600" fill="#94a3b8">Spent: AED 180.00</text>
        <text x="362" y="66" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">Limit: AED 800.00</text>
      </g>
    
      <g transform="translate(0, 368)">
        <rect width="378" height="84" rx="14" fill="url(#phoneCardGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="16" y="28" font-size="14">📺</text>
        <text x="40" y="27" font-size="12" font-weight="800" fill="#ffffff">Subscriptions &amp; Media</text>
        <text x="362" y="27" font-size="11" font-weight="800" fill="#ffd700" text-anchor="end">0%</text>

        <!-- Progress Bar -->
        <rect x="16" y="40" width="346" height="8" rx="4" fill="#1e293b"/>
        <rect x="16" y="40" width="10" height="8" rx="4" fill="url(#goldGrad)"/>

        <text x="16" y="66" font-size="10" font-weight="600" fill="#94a3b8">Spent: AED 0.00</text>
        <text x="362" y="66" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">Limit: AED 500.00</text>
      </g>
    
        </g>
      </g>

      
    <g transform="translate(0, 765)">
      <rect x="0" y="0" width="410" height="75" fill="#070b14" stroke-top="#1e293b"/>
      
        <g transform="translate(20, 12)">
          <text x="22" y="14" font-size="14" text-anchor="middle" fill="#64748b">⊞</text>
          <text x="22" y="28" font-size="9" font-weight="600" text-anchor="middle" fill="#64748b">Home</text>
        </g>
      
        <g transform="translate(92, 12)">
          <text x="22" y="14" font-size="14" text-anchor="middle" fill="#64748b">▤</text>
          <text x="22" y="28" font-size="9" font-weight="600" text-anchor="middle" fill="#64748b">History</text>
        </g>
      
        <g transform="translate(164, 12)">
          <rect x="-6" y="-4" width="56" height="38" rx="10" fill="#ffd700" fill-opacity="0.2" stroke="#ffd700" stroke-width="1"/>
          <text x="22" y="14" font-size="14" text-anchor="middle" fill="#ffd700">◐</text>
          <text x="22" y="28" font-size="9" font-weight="800" text-anchor="middle" fill="#ffd700">Budgets</text>
        </g>
      
        <g transform="translate(236, 12)">
          <text x="22" y="14" font-size="14" text-anchor="middle" fill="#64748b">🐖</text>
          <text x="22" y="28" font-size="9" font-weight="600" text-anchor="middle" fill="#64748b">Goals</text>
        </g>
      
        <g transform="translate(308, 12)">
          <text x="22" y="14" font-size="14" text-anchor="middle" fill="#64748b">✨</text>
          <text x="22" y="28" font-size="9" font-weight="600" text-anchor="middle" fill="#64748b">AI Assist</text>
        </g>
      
    </g>
  
    </g>

    <!-- RIGHT PANEL -->
    <g transform="translate(1100, 100)">
      <rect width="420" height="700" rx="20" fill="url(#cardBgGrad)" stroke="rgba(255,215,0,0.2)" stroke-width="1.5" filter="url(#ledShadow)"/>
      <text x="30" y="40" font-size="11" font-weight="900" fill="#ffd700">BUDGET INTELLIGENCE</text>
      <text x="30" y="70" font-size="20" font-weight="800" fill="#ffffff">AUTOMATED ALERTS</text>

      <g transform="translate(30, 100)">
        <rect width="360" height="120" rx="12" fill="#070c18" stroke="rgba(255,255,255,0.1)"/>
        <text x="20" y="30" font-size="12" font-weight="800" fill="#ffd700">SMART SPENDING LIMITS</text>
        <text x="20" y="55" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="start"><tspan x="20" >Automated warnings when category</tspan><tspan x="20" dy="18">expenditure reaches 80% threshold,</tspan><tspan x="20" dy="18">preventing budget overruns.</tspan></text>
      </g>
    </g>

  </svg>