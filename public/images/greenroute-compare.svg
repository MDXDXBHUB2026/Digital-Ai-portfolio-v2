      <text x="368" y="21" fill="#b45309" font-family="sans-serif" font-size="12" font-weight="800">☀️ Low Heat (Shaded Concourse &amp; AC Walkways)</text>
    </g>

    <!-- Why This Route Accordion -->
    <g transform="translate(24, 314)">
      <rect width="704" height="106" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="18" y="26" class="txt-dark" font-size="13" font-weight="900">❓ Why this route?</text>

      <text x="18" y="48" class="txt-sub" font-size="12">Recommended for maximum sustainability. Cuts CO2e emissions by 83% compared to driving alone.</text>
      <text x="18" y="66" class="txt-sub" font-size="12">Prioritizes zero-emissions electric rail and climate-protected pedestrian bridges.</text>

      <!-- 4 Quick Fact Pills -->
      <g transform="translate(18, 76)">
        <rect x="0" y="0" width="120" height="22" rx="11" fill="#dcfce7"/>
        <text x="10" y="15" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="800">🌱 0.52kg CO2e</text>

        <rect x="130" y="0" width="100" height="22" rx="11" fill="#f1f5f9"/>
        <text x="140" y="15" class="txt-dark" font-size="11" font-weight="800">⏱ 32 min</text>

        <rect x="240" y="0" width="100" height="22" rx="11" fill="#f1f5f9"/>
        <text x="250" y="15" class="txt-dark" font-size="11" font-weight="800">💰 7.5 AED</text>

        <rect x="350" y="0" width="120" height="22" rx="11" fill="#f1f5f9"/>
        <text x="360" y="15" class="txt-dark" font-size="11" font-weight="800">🚶 6 min walk</text>
      </g>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(24, 432)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="40" y="26" class="txt-dark" font-size="14" font-weight="800">🔔 Remind</text>

      <rect x="196" y="0" width="508" height="42" rx="21" fill="#059669"/>
      <text x="330" y="26" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">View Journey Timeline  ➔</text>
    </g>
  </g>

  <!-- CARD 2: OPTIMAL BALANCE -->
  <g transform="translate(24, 814)">
    <rect width="752" height="380" rx="24" fill="#ffffff" filter="url(#shadow)"/>

    <rect x="24" y="20" width="180" height="34" rx="17" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="40" y="42" class="txt-dark" font-size="14" font-weight="900">⚖️ Optimal Balance</text>

    <rect x="216" y="20" width="220" height="34" rx="17" fill="#dcfce7"/>
    <text x="232" y="42" fill="#15803d" font-family="sans-serif" font-size="13" font-weight="900">🍃 -78% vs. petrol car alone</text>

    <!-- 3 Metrics Boxes -->
    <g transform="translate(24, 70)">
      <rect x="0" y="0" width="220" height="70" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="16" y="24" class="txt-muted" font-size="12">DURATION</text>
      <text x="16" y="52" class="txt-dark" font-size="20" font-weight="900">⏱ 28 min</text>

      <rect x="240" y="0" width="220" height="70" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="256" y="24" class="txt-muted" font-size="12">ESTIMATED FARE</text>
      <text x="256" y="52" class="txt-dark" font-size="20" font-weight="900">🏷 7.50 AED</text>

      <rect x="480" y="0" width="224" height="70" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="496" y="24" class="txt-green" font-size="12">EST. EMISSIONS</text>
      <text x="496" y="52" class="txt-green" font-size="20" font-weight="900">🌱 0.68 kg</text>
    </g>

    <g transform="translate(24, 156)">
      <rect x="0" y="0" width="340" height="32" rx="16" fill="#e0f2fe"/>
      <text x="16" y="21" fill="#0369a1" font-family="sans-serif" font-size="12" font-weight="800">♿ Full Elevator &amp; Low-Floor Bus Access</text>

      <rect x="352" y="0" width="352" height="32" rx="16" fill="#fef3c7"/>
      <text x="368" y="21" fill="#b45309" font-family="sans-serif" font-size="12" font-weight="800">☀️ Low Heat (Enclosed AC Bus Stops)</text>
    </g>

    <!-- Why This Route Summary -->
    <g transform="translate(24, 202)">
      <rect width="704" height="90" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="18" y="26" class="txt-dark" font-size="13" font-weight="900">❓ Why this route?</text>
      <text x="18" y="48" class="txt-sub" font-size="12">Saves 4 minutes duration by incorporating Express Bus line with minimal transfer walking.</text>
      <text x="18" y="68" class="txt-green" font-size="12" font-weight="800">🌱 0.68 kg CO2e • ⏱ 28 min • 💰 7.50 AED</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(24, 308)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="40" y="26" class="txt-dark" font-size="14" font-weight="800">🔔 Remind</text>

      <rect x="196" y="0" width="508" height="42" rx="21" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="330" y="26" class="txt-dark" font-size="15" font-weight="800" text-anchor="middle">View Journey Timeline  ➔</text>
    </g>
  </g>

  <!-- CARD 3: EXPRESS TRAVEL -->
  <g transform="translate(24, 1210)">
    <rect width="752" height="380" rx="24" fill="#ffffff" filter="url(#shadow)"/>

    <rect x="24" y="20" width="180" height="34" rx="17" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="40" y="42" class="txt-dark" font-size="14" font-weight="900">⚡ Express Travel</text>

    <rect x="216" y="20" width="220" height="34" rx="17" fill="#dcfce7"/>
    <text x="232" y="42" fill="#15803d" font-family="sans-serif" font-size="13" font-weight="900">🍃 -70% vs. petrol car alone</text>

    <g transform="translate(24, 70)">
      <rect x="0" y="0" width="220" height="70" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="16" y="24" class="txt-muted" font-size="12">DURATION</text>
      <text x="16" y="52" class="txt-dark" font-size="20" font-weight="900">⏱ 22 min</text>

      <rect x="240" y="0" width="220" height="70" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="256" y="24" class="txt-muted" font-size="12">ESTIMATED FARE</text>
      <text x="256" y="52" class="txt-dark" font-size="20" font-weight="900">🏷 9.50 AED</text>

      <rect x="480" y="0" width="224" height="70" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="496" y="24" class="txt-green" font-size="12">EST. EMISSIONS</text>
      <text x="496" y="52" class="txt-green" font-size="20" font-weight="900">🌱 0.94 kg</text>
    </g>

    <g transform="translate(24, 156)">
      <rect x="0" y="0" width="340" height="32" rx="16" fill="#e0f2fe"/>
      <text x="16" y="21" fill="#0369a1" font-family="sans-serif" font-size="12" font-weight="800">♿ Level Access &amp; Direct Expressway Route</text>

      <rect x="352" y="0" width="352" height="32" rx="16" fill="#fef3c7"/>
      <text x="368" y="21" fill="#b45309" font-family="sans-serif" font-size="12" font-weight="800">☀️ Moderate Heat (Short Outdoor Transfer)</text>
    </g>

    <g transform="translate(24, 202)">
      <rect width="704" height="90" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="18" y="26" class="txt-dark" font-size="13" font-weight="900">❓ Why this route?</text>
      <text x="18" y="48" class="txt-sub" font-size="12">Fastest overall journey utilizing taxi/electric shuttle segment for maximum speed.</text>
      <text x="18" y="68" class="txt-green" font-size="12" font-weight="800">🌱 0.94 kg CO2e • ⏱ 22 min • 💰 9.50 AED</text>
    </g>

    <g transform="translate(24, 308)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="40" y="26" class="txt-dark" font-size="14" font-weight="800">🔔 Remind</text>

      <rect x="196" y="0" width="508" height="42" rx="21" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="330" y="26" class="txt-dark" font-size="15" font-weight="800" text-anchor="middle">View Journey Timeline  ➔</text>
    </g>
  </g>

  <!-- BOTTOM NAVIGATION BAR -->
  <g transform="translate(0, 1640)">
    <rect width="800" height="120" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <g transform="translate(40, 0)">
      <text x="60" y="48" font-size="28" text-anchor="middle">🚀</text>
      <text x="60" y="76" class="txt-muted" font-size="15" text-anchor="middle">Plan</text>
    </g>

    <!-- Compare Tab (Active) -->
    <rect x="236" y="12" width="148" height="80" rx="20" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="310" y="48" font-size="28" text-anchor="middle">🔀</text>
    <text x="310" y="76" class="txt-green" font-size="15" text-anchor="middle">Compare</text>

    <g transform="translate(440, 0)">
      <circle cx="82" cy="24" r="10" fill="#059669"/>
      <text x="82" y="31" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">3</text>
      <text x="60" y="48" font-size="28" text-anchor="middle">📊</text>
      <text x="60" y="76" class="txt-muted" font-size="15" text-anchor="middle">Impact</text>
    </g>

    <g transform="translate(620, 0)">
      <text x="60" y="48" font-size="28" text-anchor="middle">👤</text>
      <text x="60" y="76" class="txt-muted" font-size="15" text-anchor="middle">Profile</text>
    </g>
  </g>

</svg>
